<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF4EE"/>
      <stop offset="100%" stop-color="#D3E8DA"/>
    </linearGradient>
  </defs>

  <!-- light background -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- bold geometric M monogram -->
  <text x="128" y="182"
        font-family="Fira Sans, Arial, sans-serif"
        font-weight="900"
        font-size="176"
        text-anchor="middle"
        fill="#154B2E">M</text>
</svg>
