<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="slabFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="78%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#1C2E22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#50C878" stop-opacity="0"/>
      <stop offset="100%" stop-color="#50C878" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- the slab: 1 x 4 x 9 proportions, the monolith's own signature ratio -->
  <rect x="88" y="48" width="80" height="160" fill="url(#slabFace)"/>

  <!-- right-edge rim light -->
  <rect x="164" y="48" width="4" height="160" fill="url(#rim)"/>

  <!-- top edge catch-light -->
  <rect x="88" y="48" width="80" height="2" fill="#50C878" opacity="0.35"/>

  <!-- ground contact shadow -->
  <ellipse cx="128" cy="212" rx="46" ry="6" fill="#000000" opacity="0.45"/>
</svg>
